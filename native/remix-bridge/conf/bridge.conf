# RTX Remix bridge settings for The Sims 3. Copy next to d3d9.dll in Bin and into Bin\.trex (the client and the server each read their own copy).
client.targetProcess = TS3W.exe
# keep True (the default): Windows' HIGHDPIAWARE flag for TS3W is per exe path, so a copied Bin runs DPI-unaware and is
# drawn at 1/1.5 size and stretched (blurry) at 150% scaling (2026-11-07)
client.enableDpiAwareness = True
# plain DXVK in the server (.trex\d3d9vk_x64.dll = DXVK x64), not the Remix path tracer
server.useVanillaDxvk = True
# patches 0003 and 0008 (docs/540 section 3): free the client's copy of a MANAGED texture level / a static vertex or
# index buffer once it has not been locked for 2 s; the next lock fetches it back from the server. 0 = keep every copy
# (upstream behaviour).
client.freeIdleManagedCopiesSec = 2
client.freeIdleBufferCopiesSec = 2
# BridgePerf counters and BridgeDiag lines every N frames in rtx-remix\logs\bridge32.log / bridge64.log (patches 0002,
# 0004). Off for play. Test runs set 600. The diagnostics take a CRC32C of every upload, and their tables churn small
# blocks in TS3W's process heap, which grows from fragmentation (docs/540 section 3.2: about 7.6 MiB in 10 min, al325).
perfLogIntervalFrames = 0
