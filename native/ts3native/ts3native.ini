[MintFuse]
; docs/139 §4 (mintfuse.cpp; counters v164): EA fuses a superinstruction only when a whole straight-line run equals it. Sub=1 also
; fuses the same 22 sequences inside runs (matcher call 0xE5C8CA, ours at DLL load). Script methods get fewer dispatches; acts at
; transform time, so no in-load A/B: compare two loads. Steam 1.67 only: other bytes at the site refuse (mfReady -1, log SKIP mintfuse).
; Offline -7.1% on the mint bench [measured offline]; in game ~2-8 ms/s [inferred], overlaps compiled bodies after S1 [inferred]. Default OFF, not run in game.
Sub=0

[MonoFast]
; docs/139 §8 (0.36.127, mintcall.cpp; counters v143): own mint handlers for call, callvirt (inline-cache hit), ret and
; ret.void. Every case EA's path treats differently (new frame slot, transform, native body, arena chunk change, depth
; limit, value-type receiver, cache miss, exception, newobj, yield) goes to EA's handler unchanged; otherwise the same
; words are written in one pass. Refuses when EA's call path bytes are not the stock ones (e.g. [GcRootCheck] TailWatch).
; CallPath=1: fast path (the harness flips it per arm: --ab mintcall); CallPath=2: verify (every VerifyEvery-th eligible
; call also runs EA's handler from the same state and the result is compared: mcMismatch must stay 0; heavy, correctness
; runs only, no timing). Default OFF in the v0.2.5 release (on since 0.36.16x in tests; mintcall-verify 4/4 exact, mintcall-ab 7 runs ~-8 ms/s Mono time).
CallPath=0
VerifyEvery=16

[MonoJit]
; Wide=1 (docs/537 §10, default 0): float arithmetic, conversions, ldind/stind r4/r8, ldstr, ldtoken, castclass as templates, and listed
; methods with exception clauses compile (normal body, no lazy body, not verified per call).
; Inline=1|2 (docs/537 §9, default 0): tiny compiled callees inlined at compiled call sites. 2 adds a null-checked ldfld, ldind and ldlen
; on any base and a value-type this. Each needs its callee on the list. Runs under Mode=1 or Mode=2, with or without Direct.
; docs/527 step 1: the method compiler in the game. Default OFF, not in a release. A listed method (monojit-list.h, the compile rows
; of docs/data/jit-hot.csv) whose IL hash is known runs compiled on the sim thread; every call and return still goes through
; EA's or [MonoFast]'s handler. Steam 1.67 only; off for another exe, MonoPatcher ForceJIT, TailWatch or another owner of the table.
; 1 = install.
Enabled=0
; 1 = compiled, 2 = verify: the sampled call runs compiled, the graph is restored, EA's interpreter runs it again, every word must match.
Mode=1
; Mode=2: one call in N per method is verified.
VerifyEvery=16
; Lazy frames (docs/207 §12, docs/537): a compiled call of a compiled method runs natively, with no frame until the callee's first
; exit. Not proven in game; docs/223 §8 gates it on the reader trap below. Needs no other switch.
Direct=0
; With Direct=1: 1 = only leaves get a lazy body, 0 = chains and guarded callvirt too. With the current list 1 has no listed edge (docs/537 §5).
DirectLeaf=1
; With Direct=1: 1 = the frame reader trap (docs/537 §3): sampled windows with poison and debug registers. A correctness build, never for play.
Trap=0
; Trap=1: lazy calls per window.
TrapEvery=1024
; Template groups, to bisect a mismatch: 1 float fields + ldflda, 2 static fields, 4 arrays, 8 stobj, 16 cknull / strlen / getchr,
; 32 div.un / rem.un / rem.r8, 64 switch, 128 value-type moves and ceq.i8, 256 initobj / isinst / shr.un.i8 / float moves and the direct internal calls.
Groups=511
; docs/537 §20 B1 (default 0): 1 = stfld.vt, ldelem.any.vt, stelem.any.vt, ldobj (value types) and stobj.vt compile natively (group 1024).
; A null or an index past the length leaves to EA's handler; heap stores log for Satb. Correctness-tested in the host only.
VtOps=0
; docs/537 §20 A (default 0): 1 = call exits. A compiled callee with hot exits keeps a lazy body (an exit writes the frame first),
; Array.GetLength / GetLowerBound / GetRank run inline (only if EA's bytes match; a null or a bad dimension leaves to EA), and a
; guarded callvirt takes a boxed value-type receiver (this = box + 4, as EA's). The lazy-body parts need Direct=1 (the receiver part DirectLeaf=0). Correctness-tested in the host only.
CallExit=0
; docs/537 §20 B2b (default 0): 1 = newobj of a value-type class (KeyValuePair, List / Dictionary Enumerator, ObjectGuid) calls the
; ctor's lazy body natively (this = the value-type cursor, as EA's). Any bail, an enum, a class without layout or a ctor without a
; lazy body leaves to EA's newobj. Needs Direct=1. Correctness-tested in the host only.
NewVt=0
; docs/data/monojit-exits-handoff.md C0 (default 0): 1 = count mode, a measurement run only (an inc per compiled position and exit).
; Logs the host census lines (jitbail per call site and bail reason, jitmat, jitnew, jitcalls, jitexit) every 5 min, after each save
; and at exit, at most 6000 lines per report; counters in memory only. Read with node tools/jit-hot.ts --game-count <ts3native.log>.
Count=0
; Comma list of Class.Method: narrows the built-in list. A name outside it stays refused (no known hash). Empty = the built-in list.
List=

[AutShadow]
