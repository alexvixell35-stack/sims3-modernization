; Bit mask of collect detours: 1 = IC_Route_Replan 0x765490, 2 = IC_Route_PlanFromPoint 0x765240, 4 =
; IC_Route_ReplanFromPosition 0x765550 (7 = all). 0 = nothing hooked, today's behaviour. A route being followed stays sync.
Kinds=0
; Start value of the runtime switch (ts3native_counters.arMode +0x14A8; --ab asyncreplan). 0 = shadow (every START check
; runs and is counted in arShadow, the plan stays synchronous), 1 = async.
KindsMode=1
; docs/176: ForeignKinds = the Kinds bits for STARTs from a task that is not the route's Sim (vehicle/boat followers); 4 =
; ReplanFromPosition only (Kinds=0 keeps own-task plans sync). ForeignKindsMode = start of afMode (--ab a10foreign).
; ON in release (Rodney 2026-11-09): ip A/B route -37.5 ms/s (IP natural ABBA on pair master1108: route 100.5 -> 63.0 ms/s in both orders, no hitch regression, correctness clean).
ForeignKinds=4
ForeignKindsMode=1
