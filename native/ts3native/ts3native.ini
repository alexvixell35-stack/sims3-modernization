; after each job; the worker still runs only in the window (WindowWaitUs as before). 2 = act: the worker runs on through
; the next ticks and reads cut values through the log (no window wait, no stop at the window close); an unknown store
; path stops the worker first. Run 2 only after the probe passed the docs/206 §5 gate. 0 = off.
Satb=2
; TierReqLots=1 (default 0): as in the gate 2 runs (docs/222 §11.6).
TierReqLots=1
; Mode=3 = go-live (docs/124 §17): the game uses the worker's meta scores. Needs ts3fixes switches autshadow + autlive
; (off = the game's search, no request). The B13 hook posts, yields until the result is ready, then the B14 hook sends the
; worker's top TopN passing pairs (plus off-list ads, live objects) through the game's C1; bands by the §16.1 rule. The
; keys below are read only with Mode=3. VerifyEvery=N: every Nth cut also runs the sim-thread reference (Mode R compare;
; an A2/A3 turns go-live off for the session), 0 = never. Dry=1 (G7): compute what consume would pick, compare it with
; the game's own search, use nothing. MaxWait = ticks the search may wait for the result (then the game's B13 runs).
; Margin is per mille (0 = the exact rule). Bands = bands incl. band 1 before every remaining pair goes through C1.
; Unseen=1: unseen-direct go-live for players (docs/222), turns ts3fixes switches autshadow, autlive and autunseen on without
; the test agent (a queue's --ab or fixesOff still wins). Reads only with Enabled=1 Mode=3 here, [MonoThread] Enabled=1 and
; [UserDiag] Enabled=1; go-live also wants the rest of the gate state (Satb=2, the [MonoThread] P4 keys, queue
; golive-unseen-gate.json). ON in release (Rodney 2026-11-08): gate 2 BP +6.4 / IP +12.2 ms/s. Household and selected
; Sims are never unseen (ts3fixes UfWhy), so their searches stay the game's own.
TopN=10
Bands=3
Margin=0
MaxWait=3
VerifyEvery=50
Dry=0
Unseen=1

[WorldImage]
; Mono M3.1 world image capture (docs/123 §8). At the return of MonoScriptHost_Simulate, every 30 ticks, a file named
; "request" in OutDir starts one capture: the helper worldimage.exe (native/worldimage) suspends the game, writes
; OutDir\wi-<UTC time>-<n>\ (~2 GB: header.txt, mem.bin) and resumes. Stalls the game seconds per capture: capture
; jobs only, never timing runs. Images hold personal data: keep OutDir under <repo>\game-copy\worldimage. OFF by default.
Enabled=0
OutDir=
; empty = worldimage.exe next to ts3native.asi
Helper=
MaxCaptures=5

[CrashReport]
; Opt-in crash report for players (0.36.7, crashreport.cpp, docs/135). On a crash, writes a text report to
; Documents\Electronic Arts\The Sims 3\ts3native-crashes\ (version, exe SHA-256, enabled sections, fault module+offset,
; registers, a module+offset stack, the last 50 ts3native.log lines, package file names, CPU/RAM/OS); user paths, the
; user name and the machine name are scrubbed. A session that ends without a clean exit and without a report leaves
; running.txt behind, and the next start writes a "hard" report. Nothing is sent from the game: `node tools/report-crash.ts`
; shows the report and sends it only after you confirm (your own gh login, or a prefilled GitHub issue page). OFF until tested.
Enabled=0

[P6Waits]
; 0.36.57 (docs/189 phase 0, counters v123, p6wait.cpp): the sim thread's job waits by arm (the P6 switch at the job's start), job
; outcome and waiter class, log only. Default 0 since 0.36.63 (the P6 queues set it); no runtime switch (counters, ini only).
Enabled=0

[ResourceCache]
; EXPERIMENT (0.36.80, docs/198 §4, counters v136 rt*, rctrim.cpp), off; never a release default: ResourceCache is Apex
; Radiance's area. 1 = call the game's own shrink of both ResourceSystem caches (0x733E70: every idle, unreferenced
; entry dropped) on the main thread right after the ResourceSystem service update, 2 s after each world load (needs
; [UserDiag]; travel arrival = a load with a new world name) and every TrimEveryMin minutes of play (0 = off, max 600).
; One "rctrim:" line per trim: cache held/idle before -> after, freed, private bytes, commit, largest free, ms. Stands down
; when Apex Radiance is loaded and [Compat] ApexStandDown=1. Overwatch nightly trigger not built (no ts3fixes signal).
TrimAfterCleanup=0
TrimEveryMin=0

[EaCrashFixes]
; Fixes for EA's own lifetime bugs (0.36.121, eafix.cpp, docs/67 §26.4 / §27.5, counters v141 ca* / tp*). Each key ships on once the 2026-11-01 rule holds (seen in play, reproduced, fix proven in the repro); the others stay OFF until then.
; ConformActor=1 (issue #98, crash V): before a route-follow body asks an animation controller's actor whether the
; controller still runs (0x84EAC6, 0x849591, 0x85352A), checks that the actor is alive: a set of live AnimationComponents
; (their constructor and destructor call sites) plus the actor's vtable word. A destroyed or freed actor gets the game's
; own "controller done" answer, so the game drops that controller instead of calling through freed memory. Live actors
; and other actor types get the game's own call. One "ea fix: ConformActor" line for each of the first 8 skips.
; ThumbPose=1 (issue #99, crash W): the Sim thumbnail render (0xD59C10, lookup branch) keeps its reference to the pose's
; owner until the pose is evaluated, instead of releasing it just before.
; ThumbPoseBones=1 (issue #99, crash W at 0x54E79A, docs/67 §27.6): the thumbnail render no longer uses a source pose with
; fewer bones than the rig it poses (it read that pose at the rig's bone numbers, past its end). The pose modifier then
; skips that pose, as it does when a model has none. One "ea fix: ThumbPoseBones" line for each of the first 8. On since 2026-11-05.
; GeomBoneIndex=1 (0.36.149, docs/67 §28, crash X at 0x5C6E07): a CAS mesh (GEOM) whose vertex names a bone past the
; mesh's own bone list made the Sim builder read past that list. The GEOM getter (vtable slot 0xFE3314) now answers 0
; for such an index, so the builder takes its own path for a bone the rig lacks. In-range bones are unchanged.
; One "ea fix: GeomBoneIndex" line (mesh and its resource key, index, list size, caller) for each of the first 8.
; GeomNoMaterial=1 (0.36.149, issue #80, docs/67 §29, crash at 0x5DDFBD): a CAS part whose mesh (GEOM) has no embedded
; material (custom content: a morph mesh named as a LOD) made the Sim builder read through a null pointer. That part is
; now skipped for that LOD, the path the game already takes for a part without a mesh. One "ea fix: GeomNoMaterial"
; line for each of the first 8. On since 2026-11-01 (#80 seen in play, made repro crashed off and ran clean on, docs/67 §29.3).
; MintDivGuard=1 (0.36.149, issue #114, docs/213 §8, counters v144 md*): in the script interpreter, int division of INT_MIN
; by -1 hit the CPU's divide error, which froze the sim thread. Now INT_MIN / -1 throws OverflowException (as .NET does)
; and INT_MIN % -1 gives 0. Every other division runs the game's own code. One "ea fix: MintDivGuard" line with the
; script stack for each of the first 8.
; WorldAStarRefs=1 (0.36.151, docs/67 §30, counters v146 wa*; Isla Paradiso crashes at 0x67663F / 0x6742B5 / 0x6743FE): the
; world A* skips a neighbour whose decoded chunk is outside the map or whose waypoint is past its chunk's count, the way
; it skips an already closed one, instead of reading past the routing graph's tables. One "ea fix: WorldAStarRefs" line
; for each of the first 8 skips (current waypoint, reference word, map size).
; PortalFlagRefs=1 (0.36.152, docs/67 §30.5, counters v146 pf*): the cause of those neighbours. The two writers of a
; waypoint's blocked flag (lot portals 0x82A190, lot waypoint neighbours 0x82B590) skip the write when the waypoint is
; not in the routing graph, instead of writing into another waypoint's references. One "ea fix: PortalFlagRefs" line
; for each of the first 8 skips.
; LotGridMiss=1 (next version, docs/67 §31.8; Isla Paradiso Error 12): the lot routing finalize (0x82B590) clears a
; lot's "build in progress" flag only after its world connection pass. A lot whose centre has no world grid point (a
; save started on another version of the world, or a lot made in play) left without the clear, stayed "in progress" for good
; (rebuilt about once a second), and made every save fail with Error 12, minus that lot's and later lots' records. Such a
; lot now takes the game's own exit for a lot with nothing to connect, which clears the flag. One "ea fix: LotGridMiss"
; line for each of the first 8 lots. On since 2026-11-03 (seen in play, reproduced 13 of 13, fix proven: docs/67 §31.9).
ConformActor=0
ThumbPose=1
ThumbPoseBones=1
GeomBoneIndex=1
GeomNoMaterial=1
MintDivGuard=1
WorldAStarRefs=1
PortalFlagRefs=1
LotGridMiss=1

[IlPatch]
; docs/506 §2, docs/526 (next version, ilpatch.cpp, counters v907 ilp*): mid-method core fixes shipped as a diff. A fix is
; a spec (mods/ilpatch/specs/<id>.json, built into the asi by tools/ilpatch-convert.ts --emit-native): the method, the
; exact size and SHA-256 of its IL body per known build (EA 1.67, simler90 UPDATE242) and the instructions to insert.
; When Mono transforms that method for the first time, the body is hashed; on an exact match our instructions are
; spliced into a copy (branches re-encoded, exception clauses moved), the copy is checked against the converter's hash
; of the same result and handed to the transform through the method's cached header for that one call. Any other body
; (another core mod, Tiny UI Fix, an unknown build) is left alone and logged once. One switch per fix, all off:
; Enabled=1 turns the detour on; each fix needs its own key too. Log: "il patch: <id> applied to <method>".
Enabled=0
; ilp_fixupnoinventory=1 (core build 89): SimDescription.Fixup skips the trait-chip pass for a Sim with no inventory
; (the pass threw on such a Sim).
ilp_fixupnoinventory=0
; ilp_remotechatnoeverydayoutfit=1 (core build 80): a phone chat with a Sim who has no everyday outfit no longer throws
; (the portrait balloon is shown only when that outfit exists).
ilp_remotechatnoeverydayoutfit=0
; ilp_scavengersleep=1 (core build 87): ScavengerOpportunity.OnAdded sleeps between spawns only where a script may
; yield (Simulator.CheckYieldingContext), instead of throwing from a non-yielding context.
ilp_scavengersleep=0

[GcGrowLog]
; Log only (docs/232 Run 8l, gcgrow.cpp, counters v161 gw*): one "gcgrow:" line per Boehm GC heap expansion (blocks asked,
; needed blocks, heap before / after, collection count, bytes allocated since the last GC, thread, native return addresses
; and up to 16 script frames), a "gcgrow why:" line with the GC_allochblk_nth refusal inputs (large bytes left, finalizer
; bytes, blacklist spacing, large-alloc warn counter) and the tuning XML key if Simulator_LoadXmlAsString is running on that
; thread ("gcgrow xml:" for strings of 1 MB or more). The first 50 expansions, then every one of 64 MB or more, 500 lines at
; most; the 20 expansions up to the heap crossing 600 MB are always written. Changes
; nothing in the game. Run 8k: the heap grew from 352 MB to ~2.3 GB at the main menu and the game ran out of address space.
Enabled=0

[LauncherFix]
; docs/255, launcherfix.cpp: EA launcher bug (Steam 1.67). Read only by Sims3LauncherW.exe, never by the game. The launcher's
; telemetry job uploads Sims3Logs.xml to EA's dead server and busy-waits until the file is gone, so the launcher
; process stays after its window closes. 1 = skip that upload (byte-checked patch in TSLHost.dll; unknown launcher or
; TSLHost builds are logged and left alone). The launcher writes its lines to ts3native.launcher.log. Code default 1;
; this ini keeps it 0 (opt-in) until the test build is confirmed.
Enabled=0
