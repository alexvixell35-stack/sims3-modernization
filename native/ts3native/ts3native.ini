WatchdogKind2=0

[RouteBudget]
; Cap on one route search request (docs/15 phase 4): over budget, the world A* 0x676260 sees every further edge as blocked
; and fails through its own exit, i.e. an ordinary FailedBecauseNoPathToDestination. Needs the Route_PlanLocked detour
; (installed by this key too). Lot/portal searches (0x63E340) are not capped. OFF until verified in game.
; 1 = patch the A*'s five cost-function pointers (0x676340-0x676368) and install the detour.
Enabled=0
; Start value of the runtime switch (ts3native_counters.budgetMode; /native?routebudget=0|1). 0 = no cap, 1 = cap.
Mode=1
; Nodes generated per request (all A* runs inside one Route_PlanLocked, incl. its retries). 0 = no node cap. Range 1000-10000000.
; No default yet: set it above the budgetMaxNodesOk counter of an uncapped run.
MaxNodes=0
; Time per request, microseconds (checked every 16 nodes). 0 = no time cap. Range 5000-2000000.
; 100 ms = 4x the Isla Paradiso mean plan (25.4 ms) and 28x Bridgeport's (3.6 ms); BP's longest single search was 188 ms.
MaxUs=100000
; 1 = cap only routes with RouteOption DebugPathPlan (hi word bit 0x1) set, for a C# caller that marks unseen townies.
; Nothing sets that bit yet, so 1 means "cap nothing" today.
OnlyFlagged=0

[RouteJobPhases]
; Per-phase timers inside the route worker's jobs (docs/150 §7, counters v87), observe only: cell A*, post pass, path-node
; insert, world A*, lot legs, portal A*, candidate loops, LotGraph_Build, pending lot updates, water, allocator, Lock_Acquire,
; host-call waits, rest of the job; self time per phase and job kind (own START, own A10, foreign). Worker thread only: other
; threads pass the stubs with one compare. Adds two QPC reads per timed call to the job. Report: tools/harness/route-phases-report.ts
Enabled=0
; docs/159 §5 (counters v96 hc*, hostcalls.cpp), observe only, needs Enabled=1: each host call the worker proxies during a job
; split into queue per serve site (lock pump +0x918 / other lock, READY poll, job waits, sync plan wait), service, return and
; nested plans; queue time inside the frame-limiter window; door asks at 0x64F4D3 by key (repeats within a job and their wait,
; answer changes, same key from another job within 1 s). Installs the door stub (shared with [RouteAsync] DoorMemo).
HostSplit=0
; docs/164 (counters v97 syp*, syncphases.cpp), observe only, works without Enabled=1: the same timers on the sim thread's own
; sync plans (the [RouteAsync] sync path through the route IC, and every other Route_PlanLocked the sim runs: Replan with A10
; off, ThreadedObjects plans), the frames a player sees freeze. Per plan: phases, world A* calls by planner loop (goal-lot
; entry loop, open-ground goals, circle pre-pass), Route_PlanLocked result. One line "route phases: sync plan N ms ..." per
; plan >= [RouteAsync] LogFallbackMs (20 per minute). Costs one pushad + call per Route_PlanLocked on other threads, and two
; QPC reads per timed call inside a sync plan. Report: tools/harness/route-phases-report.ts --sync <ts3native.log>
SyncPlans=0
; docs/247 §9: most sync plan lines per minute (default 20; the rest only count in sypLinesDropped).
SyncLinesPerMin=20
; docs/177 §5 probe P-G (counters v102 pg*), observe only, needs Enabled=1: four more worker phases, goal generation 0x751FF0,
; goal step 0x75C2D0, EditPathForRoute 0x85FF30 and GoalPoint_Validate 0x759B20 (counted per job); with it on, "rest of job"
; = v87 other + these four. One line "route phases: long rest N ms ..." per job whose rest is >= 50 ms (20 per minute).
GoalSplit=0
; docs/178 T3 probe P-GS (counters v103 gs*), observe only, needs GoalSplit=1: eight sites timed when called directly from the
; goal step (lot planner 0x63F490, room graph 0x63D2F0, LotPortalSearch 0x63EC40, Q reset 0x61E320, obstacle query 0x82EDB0,
; gather 0x82F0B0, range query 0x83B3A0, lot index rebuild 0xC68680; through [RouteGate] / its Sites stubs where present).
; One line "route phases: goal step N ms ..." per goal step >= 50 ms with the 8 sites, every other timed phase inside the step,
; the step's own code ("unattributed"; all add up to N) and its QPC window (20 per minute; 0.36.32, docs/178 §6.5).
GoalStepSplit=0

[GoalGen]
; docs/177 §3 design D1 (counters v102 gg*): a radius route (max radius <= min) builds its goal ring twice with the same inputs
; (ring count 1 at 0x75C05C, loop 0..count). 1 = install the thunk on the ring builder call 0x75C246 (the 8 bytes at 0x75C05C
; are checked first; refused and logged when they differ). Mode = start value of ggMode (+0x43B4, native_set goalgen / --ab
; goalgen): 0 count only, 1 skip the duplicate ring (validations -17 per radius route; same goal), 2 shadow (both rings run,
; arguments and, on worker jobs with [RouteJobPhases] GoalSplit=1, validation answers compared). BytePatch=1 also writes the
; immediate 1 -> 0 at 0x75C060 (release form, no runtime switch). OFF until its A/B (tools/harness/queues/route-goal-ab.json).
SameRing=0
Mode=1
BytePatch=0

[CellMemoProbe]
; docs/150 §12 (counters v88 cm*), observe only, needs [RouteJobPhases] Enabled=1: per worker plan (Q reset to Q reset), hashes
; each in-room leg request (InRoomPlan / InRoomPlanToPoint, design M's key) and counts repeats and the cell A* time they cost
; (cmHitCellUs = would-hit time if a within-plan leg memo existed). Nothing is cached.
Enabled=0

[RouteEarlyOut]
; No-path pre-check probe (docs/142, counters v78): observe only, every route result stays the game's. Detours the world A*
; 0x676260 (and the Route_PlanLocked detour for the request scope). Before each search it asks whether the search must fail
; (car-only components of R, the game's own flood colours, an earlier failed search of the same request with the same start
; and walls), lets the search run anyway and counts the time a real early-out would save; a proof that a path disproves
; counts eoWrong (expected 0, logged). One log line per request >= LogMs: world A* calls, fails, ms, provable calls and ms.
; Mode=2 (docs/142 §9, 0.36.22, counters v86): car and memo proofs answer the search without the flood: the context fields,
; *best and closed bits the game's failed search would leave, result 0. Colour proofs stay observe only. OFF: not run in game.
Enabled=0
; 1 = probe (observe only), 2 = act (needs Act=1; Act=0 = shadow: every proof answered both ways, the game's answer used), 0 =
; pass-through. The runtime switch ts3native_counters.eoMode (+0x3260, --ab earlyout) turns it on (1) or off (0) at this level.
Mode=1
Act=0
; Mode 2: the first ShadowFirst proofs and then every ShadowEvery-th are answered both ways and compared (eoActDiff); the first
; difference turns acting off for the session (eoActOff). MemoMinUs: a memo (with its wall print) only behind a failed search
; that took at least this long.
ShadowFirst=32
ShadowEvery=16
MemoMinUs=1000
; Requests at or above this many ms get a log line (20 per minute). Range 1-60000.
LogMs=200

[SaveWrite]
; Save timing and the old-save backup copy off the sim thread (docs/15 phase 7). Hooks six call sites of the native save
; FUN_00AB1030 and logs one line per save (total, package write, backup, copy, final flush).
; write = "N (call)" timed at 0xAB12AF; with Apex MemoryGuard owning that call (docs/148 §7a) "~N (gate span)" from the
; [RouteGate] Sites entry at 0xAAC110 to the next step, "~N (info span)" without [RouteGate] sites; a phase not timed reads
; "not measured" (docs/25 §10). Verified in game 2026-10-14 (two saves, backup by the worker, save reloads); on in the stable build.
Enabled=1
; Start value of the runtime switch (ts3native_counters.saveMode). 0 = time only, the game backs up the old save itself;
; 1 = a worker copies the old save to <TS3 user folder>\ts3native-backup.tmp while the game writes the package, and the
; backup step renames it to <name>.sims3.backup (the game's own copy runs instead if anything does not match).
Mode=1

[Decompress]
; Faster RefPack decoder (docs/15 phase 6): retargets the one call to the decode core (call at 0x4EC065 -> 0x4EB3B0) to RefpackFast,
; same results and bytes as the game (offline test: 3.7 GB of shipped resources identical; 2.2x a C port of the game decoder, 1.8x S3SS RefPackDecompressor).
; Verified in game 2026-10-14: Verify=1 over a Bridgeport load, 33,121 calls, 0 mismatches; ~144k calls in 4 sessions, 0 fails. On in the stable build.
; Does not touch 0x4EB3B0, so S3SS's patch there stays as the mode-0 path. Logs calls, MB, ms and threads every 60 s.
Enabled=1
; Start value of the runtime switch (ts3native_counters.decompressMode): 0 = the code at 0x4EB3B0 (S3SS or the game), 1 = RefpackFast.
Mode=1
; 1 = mode 1 also decodes with 0x4EB3B0 into a scratch buffer and compares (counts mismatches, keeps that result). Slow: first runs only.
Verify=0

[Alloc]
; Per-thread cache in front of EA's general allocator (docs/15 phase 8): frees of chunks up to 1 KB are kept per thread and per
; heap and handed to the next Malloc of that size without the heap's lock and without 0x4E5E40. Detours Malloc 0x4E69D0,
; Memalign 0x4E6A20 (align <= 16, offset 0 only), Free 0x4E5920 and Shutdown 0x4E5CB0. Cached chunks stay allocated as far as the heap knows; no new memory is reserved.
; OFF until verified in game.
Enabled=0
; Start value of the runtime switch (ts3native_counters.allocMode): 0 = every call goes to the game, 1 = cache.
Mode=1
; Chunk bytes one thread may hold. Range 16-1024.
ThreadKB=64
; Total for all threads: MaxMB / ThreadKB threads get a cache, the rest run uncached. Range 1-32.
MaxMB=4
; Chunks per size (16-byte steps) per heap per thread. Range 4-256.
PerBin=32
; docs/67 crash lead: a second Free of a chunk this thread already caches would hand it to two owners. 1 = drop that Free (the
; first one still owns the chunk) and count it (allocDupFrees, counters v23); 0 = old behaviour, still counted. Runtime switch
; ts3native_counters.allocDedupe (+0xC1C, --ab allocdedupe). Same thread only. OFF until measured; keep Enabled=0 without it.
Dedupe=0

[WaterJps]
; Water-grid jump-point search (docs/15 phase 9): the jump 0x61FE10 of the boats/swimming route search 0x620560 (recursive, one call
; plus about ten helper calls per cell) runs as one inlined loop, WaterJump. Same results: 43.9M jumps on random grids identical to the
; game's own code (out\waterjps-test.exe), 3.9x faster offline. Retargets the call at 0x6207FB only; skips itself when the code there
; differs from Steam 1.67. Verified in game (Isla Paradiso, Verify=1: 5.4M calls, 0 mismatches); on in the stable build.
Enabled=1
; Start value of the runtime switch (ts3native_counters.waterJpsMode): 0 = the game's jump, 1 = WaterJump.
Mode=1
; 1 = mode 1 also runs the game's jump and compares (counts and logs mismatches, uses the game's result). First runs only.
Verify=0

[SaveFlush]
; The new save's flushes off the sim thread (docs/15 phase 10): the FlushFileBuffers passes of save steps 9 and 11 (calls at
; 0xAAFD8A and 0xAAF737 to 0xAAF4B0) are recorded during the save and replayed in the same order by a worker right after it.
; The bytes are written before the game reports success; only an OS crash or power loss in the next ~second could lose them
; (the .backup was flushed before). The next save, travel and the load copy (0xAB16ED) wait for the worker first.
; Needs [SaveWrite] Enabled=1. OFF until verified in game.
Enabled=0
; Start value of the runtime switch (ts3native_counters.flushMode): 0 = the game flushes during the save, 1 = the worker after it.
Mode=1

[SaveSlim]
; The saved ExportDB without dead space and without outfit copies nothing needs (docs/15 phase 11, saveslim.cpp). Every
; Sim who leaves a lot gets a new outfit + textures in <world>ExportDB.package; the game never deletes the old ones nor reuses
; freed bytes, so lived-in saves grow by MBs per session. After each normal save that worked, a background worker rewrites
; each ExportDB of Saves\<name>.sims3 (the game plays from CurrentGame.sims3 and only copies that folder): to a temp file in
; the TS3 user folder, compared byte for byte, then renamed over it. The next save, travel and load wait for it.
; The file before the rewrite stays in <TS3 user folder>\SaveSlimBackup\<name>.preslim\ (newest only). Any error leaves
; the save as the game wrote it ("save slim: FAILED" in ts3native.log, counter slimFails).
; Needs [SaveWrite] Enabled=1. Opt-in TEST feature (v0.2.5): changes save files, keep your own save backups.
Enabled=0
; 0 = Mode 2 measured and logged, nothing written; 1 = rewrite without dead space; 2 = also drop the outfits no other saved byte names
; and the textures only those outfits name (textures nothing names stay).
Mode=2

[UserDiag]
; docs/188: lines in this log that answer the first questions about a player report (send the whole ts3native.log).
; Header ("diag:" lines): versions, edition and install class, ini sections, Bin add-ons, packs, GPU, display, disks, Mods
; (Resource.cfg, package count and size, script packages, first 200 names), saves; a low-priority worker 15 s after start.
; World load: "ts3fixes:" lines (settings, world size, script assemblies) and loaded modules. Save trail ("save:" lines, needs
; [SaveWrite] Enabled=1): start state (route jobs, queues, +0x918 owner, memory), each phase start and end, long waits, a
; "still running" line every 5 s while a save runs, end with the save folder size. File names only, user folders scrubbed.
; Logging only; no per-frame work (one thread per save, a few lines per load and save). 0 = off.
Enabled=1

[MemDiag]
; docs/190 phase 1, docs/191 module 1 (0.36.69): one "diag: mem" line (numbers only) after every [UserDiag] "memory at"
; line (world load, save start / end, every 10 min, exit) and at event marks (ts3agent mem_mark; travel and world switch are
; tagged on the load / save lines). Fields: OS private bytes, address-space walk sums (private, committed, free, mapped,
; thread stacks, 64 / 128 MiB arenas), EA heap direct blocks, our routesnap memory, Boehm GC heap, ResourceCache and
; AnimationCache bytes, remainder. "?" after a value = not validated, "!" = failed this session's self-test. Reads only, on
; the [UserDiag] memory worker. Needs [UserDiag] Enabled=1. 0 = off (default until verified: queue mem-diag-verify.json).
; Module 2 (0.36.74, docs/191): marks are sampled on the marking thread; after every line ts3fixes answers with one
; "diag: memsus" line of managed leak-suspect counts (custom-control dictionary, delegate list lengths; docs/192, docs/193).
Enabled=0
; Light (0.36.79, docs/191 "Player memory lines", default on, also with Enabled=0): the same diag: mem and memsus lines
; (numbers only) at world load / travel arrival, save, exit and every 5 min of play, plus "diag: memsus alive" (1 in 32
; destroyed objects held weakly; how many are still alive after 2 GCs, by type) and "diag: memsus types" (object counts by
; type once per load). No self-test. ~30 ms VirtualQuery walk per sample on the memory worker, <1 ms on the sim thread.
; Send ts3native.log with a report; node tools/memory-report.ts reads it. 0 = off (with Enabled=0).
Light=1
; Correctness runs only: 30 s after the first world load the memory worker allocates known sizes (VirtualAlloc commit, a
; 64 MiB arena-like reserve, a thread stack, a file mapping, routesnap heap, EA heap direct blocks) and checks that each
; field moves by that size; then leaks 8 MB on purpose (kept until exit) and logs "diag: mem selftest PASS|FAIL". Also asks
; ts3fixes for its suspect-counter self-test (adds and removes one known entry per counter, "diag: memsus selftest").
SelfTest=0
; Experiment (docs/199, memexp.cpp, OFF; test runs only until its cost is measured): Cork-style type growth
; (Jump & McKinley 2007/2009). After every TypeGrowthEvery-th completed Boehm collection: live managed objects per class
; (count, bytes), Cork ratio rank (decay 15%, candidates need 2+ growth phases and rank > TypeGrowthRankMin), and for the
; TypeGrowthTopK growing classes the holder classes pointing at them (conservative: words that only look like pointers
; count too). "typegrowth:" lines; node tools/memory-report.ts reads them. Runtime switch: --ab typegrowth.
TypeGrowth=0
TypeGrowthEvery=1
TypeGrowthTopK=8
TypeGrowthRankMin=100
; holders (points-from graph, walks every word of every live object) only every Nth pass; 0 = never (0.36.83)
TypeGrowthGraphEvery=10
; TEST-RUN TOOL (docs/201, allocsites.cpp, OFF, never a release default): native address-space growth by call site, for
; Error 12 work. Hooks the EA heap entries (Malloc / Memalign / Realloc / Free) and ntdll NtAllocateVirtualMemory(Ex) /
; NtFreeVirtualMemory / NtMapViewOfSection(Ex) / NtUnmapViewOfSection(Ex) (every module's VirtualAlloc and file views).
; Heap blocks under 64 KB are sampled 1 in AllocSitesSample by address (weight N), larger blocks, every reservation and
; every view are all recorded with the caller (+ one more frame). At every diag: mem sample (each mem_mark, every 5 min)
; "allocsites:" lines: totals, top AllocSitesTop sites by live MB and by growth, sites holding regions inside the previous
; largest free block, what bounds the three largest free blocks, and allocations >= 1 MB no hook saw (usum / untr rows,
; 0.36.86). Needs Light=1 or Enabled=1. Stands down when Apex
; Radiance is loaded ([Compat] ApexStandDown=1: the allocator is its area). node tools/memory-report.ts reads the lines.
; Players: Error 12 report (test feature, docs/PLAYERS.md "Error 12 report"): set AllocSites=1 if you get Error 12, play until it happens, send ts3native.log.
AllocSites=0
AllocSitesSample=64
AllocSitesTop=12
; 0 = skip a hook group (1 = on): the EA heap entries / the ntdll virtual memory and view functions
AllocSitesHeap=1
AllocSitesVirtual=1
; RcCensus (docs/191 "ResourceCache census", test runs only): at every diag: mem line except exit, walks the ResourceCache
; entry map under the cache's own lock and logs "diag: rc census" lines: entries by resource type (count, MB, cold, refs)
; and the change since the last census. The game waits for the lock during the walk (tens of ms with ~350k entries).
; Reads only. Needs Light=1 or Enabled=1. 0 = off.
RcCensus=0
; With RcCensus=1: at the Nth census (once), sample 64 entries of the type that grew most and scan the address space for
; pointers to them; "diag: rc holders" lines name the holders by vtable (1-3 s once on the memory worker). 0 = off.
RcCensusHolders=0
; With RcCensus=1: at every census also count the live CAS SimBuilders and the generated part compositors (the in-memory
; TXTC / 0x0341ACC9 entries) their parts hold: "diag: rc builders" (one address-space scan per census, 1-3 s). 0 = off.
RcCensusBuilders=0
; With RcCensus=1: at every census also map which part compositors hold which (their child vector at +0x28): edges,
; roots and what is left on or below a cycle: "diag: rc graph" (6.5 MB once, tens of ms per census). 0 = off.
RcCensusGraph=0
; RcRefCallers (docs/191 "Who holds the part compositors", counters v908 rrc*, test runs only; not under RcCensus): counts
; AddRef / Release on the generated part compositors (two vtable slots each in 0xFE68D8 / 0xFE68F4 replaced) and the
; cache finds that return one (cache vtable 0xFFDD94 slot 6), by caller. At every diag: mem line except exit:
; "diag: rc ref callers" (each caller's AddRef, finds, Release and net since the start, top 20 by net + the 5 most
; negative, our measured hook work), "diag: rc find sites", "diag: rc registry" (the CAS compositor service's map, read
; without its lock). Needs Light=1 or Enabled=1. About 6 ns a hooked call. 0 = off.
RcRefCallers=0
; With RcRefCallers=1: sample 1 in N new compositors and keep their first 16 reference events; "diag: rc ref history"
; groups the live ones by event list and those at net +1 by their last AddRef or find, and counts how many of those the
; registry holds. 16384 slots (1.3 MB, fixed): one 35-min old-save run at 32. 0 = off.
RcRefCallersSample=32

[CasTrim]
; docs/191 "Who holds the part compositors" step 2 (castrim.cpp, counters v912 ct*, runtime switch ctMode +0x5CF0,
; --ab castrim; NOT RUN IN GAME yet): the CAS compositor service keeps every part compositor an outfit build makes in a
; map that only a service reset empties, and each stays registered in the ResourceCache (rcN, eaRes growth on long
; saves). After each insert into that map (on the inserting thread) a few more buckets are walked; a part compositor at
; exactly 2 references (the cache's and the map's) that was not inserted or found by key for AgeSec is "old".
; Mode: 0 = off, 1 = trim (erase old ones with EA's own erase 0x5EE640: unregistered, map reference dropped), 2 = count
; only (old ones are marked; a later find of a marked one is logged as "would miss"). Mode 1 logs a failed find of an
; erased key that nothing can build again (no database holds it) as "MISSED" (a lost texture; must stay 0); one a
; database holds is loaded again and counted as such. "cas trim:" lines every 5 min.
; 3 = save sweep (docs/539 §6, NOT RUN IN GAME): after each save, part compositors EA's own save left out go. All must
; hold: 2 references, a part compositor, not in EA's live set, named by no survivor (to a fixed point), not on the keep
; list ts3fixes pushes (active household, selected Sim, unknown scope; closed over the outfits' compositors), unused for
; MinAgeSec, never found by the async loader (Async). It refuses a save (logs, sweeps nothing) unless script's outfit marks
; ran after the keep list and before the native save, the list is complete, CAS and Edit Town are closed and the save
; is on the insert thread. Erases run after the save, MaxErase a tick, from ts3fixes (which needs the matching build).
; 4 = the same walk, count only (probe P4). No change to save data in either.
; Release default 3 (Rodney 2026-11-08): live Mode 3 runs on 0.36.194 (castrim-live 11-08), no inventory bad slot.
Mode=3
; 1 = only compositors that no other part compositor (itself not old) names as a child in its op list are old: a parent
; rebuilds its texture from its children by key (docs/191 step 2; al243 / al244: age alone is unsafe on the old save).
; 0 = named or not
Named=1
; 1 = only compositors whose key a database holds are old (the game could load them again). al246, old save: none has
; one, so this trims nothing. 0 = with or without a database
NeedDb=0
; 1 = compositors the async loader 0x729E10 has found by key are never old: an outfit's load (0x5E9AA0) names its
; parts by key (al249, Named on: all 6 would-misses came from there). 0 = found there or not
Async=1
; 1 = the detours go in even with Mode=0 (for --ab castrim / native_set castrim at run time)
Install=0
; seconds a compositor must be unused (no insert, no find by key) before it is old (10-36000)
AgeSec=1800
; map buckets walked after each insert (1-256), most erases per insert or sweep tick (1-64)
Buckets=16
MaxErase=8
; modes 3 and 4: seconds a compositor must be unused before a save may drop it, for builds in flight (0-36000)
MinAgeSec=60
; 1 = docs/539 probes P1, P3, P6, with counters and "diag: castrim" lines per [MemDiag] sample: CacheOutfit names, registry and
; outfit map sizes, count-0 outfits, part load fallbacks, KB allocated by CAS/GeometryResource and CAS/BlendGeometryResource
Probe=0
; 1 = docs/539 §12.5 inventory detector: each save checks every part record slot of EA's outfit inventory (call 0x5EFE11)
; before EA reads it and logs a bad one ("cas trim: inventory bad slot", first 20) with whether CasTrim erased it; one
; "cas trim: inventory check save #N" line per save (~3 ms). Log only, never skips or fixes. The erase ring and the
; 0x5E772C crash decoder are always in. Default 1 with Mode >= 1 or Probe=1, else 0
Detect=1
; 1 = the outfit release guard (docs/539 §13.5, Rodney 2026-11-08), in every Mode including 0: when the game frees an outfit
; (0x5E6E20 / 0x5E75A0 -> 0x5AF640) an [outfit+0xBC] cell that is not a valid object (0x40A00000, first dword below 0x10000,
; vtable outside TS3W .rdata) is set to 0 instead of released (that entry leaks, EA frees the rest as before), with a
; "cas trim: cell guard skipped" line. 0 = Detect's log lines only.
CellGuard=1
; docs/539 §14 (11-09 float-5 crash at 0xD4B154): with Detect=1 the ModelBuilder teardown calls 0x5D83B4 / 0x5D96AD -> 0x5D82A0
; check the part records' cells rec+4..+0x10 first ("cas trim: modelbuilder cell bad", first 40; per save "cas trim: modelbuilder
; check"). MbGuard 1 = also set such a cell to 0 so EA skips it (that result leaks); 0 = log only. Default 0
MbGuard=0
; docs/539 §15 (11-09 float-5 crash in the outfit save: memcpy to NULL from 0x5BF4C0): with Detect=1 or OutfitStrGuard=1 the save
; writer's call 0x5E7BC2 -> 0x5E61A0 checks each part object's string [rec+0x5C]+0x2C first ("cas trim: outfit string bad", first 40;
; per save "cas trim: outfit string check"). OutfitStrGuard 1 = also reset a string EA's copy would certainly fault on (object
; vtable 0xFE2A80, +0x28 = 0, begin after end or unreadable) to EA's empty string, so the save writes an empty string instead
; of crashing; anything else stays log only. Default 0 in code; 0 in the release ini until the float5-guard job (release-verify-1109) passes, then 1.
OutfitStrGuard=0
; docs/539 §15.7, TEST ONLY: Quarantine=N (Mode 3) takes one extra reference (EA's slot 0) on each compositor the sweep erases
; and keeps it for the session, so no erased compositor returns to the heap; at N held the sweep stops erasing for the session.
; Each save scans every held compositor's 0x68 bytes for 0x40A00000 ("cas trim: quarantine hit"). Costs memory; 0 = off
Quarantine=0
; docs/539 §16, TEST ONLY (needs Detect=1): WriteTrap=1 puts a hardware write watch (DR0-DR3, every thread) on up to 4 [outfit+0xBC]
; cells after each save (outfits of vtable 0xFE4A10, entry 87 of 121 / 91 and 3 of 81 first, rotated per save) and logs every write
; to them with eip, value, EA function, thread and stacks ("cas trim: write trap hit", first 200; "cas trim: float5 WRITER" when the
; value is 0x40A00000, first 100). Uses all four debug registers: off with [Watchpoint] Lot, a debugger or Frida hardware breakpoints. 0 = off
WriteTrap=0
; docs/539 §16.6 (11-09 crash at 0x6820F4, a physics quadtree node's shape vector held 0x40A00000): with Detect=1 or RealmGuard=1 the
; 3 calls to Realm_RemoveShape 0x682080 and 2 to Realm_AddShape 0x6823E0 check the node's shape vector and the realm vector's last
; entry for 0x40A00000 first ("cas trim: realm shape bad", first 40, with node, index, caller, stack scan; per save "cas trim: realm
; shape check"). RealmGuard 1 = also repair: a bad node entry gets back the realm shape that names that node and index, else it is
; swap-removed as EA's remove does; a bad realm last entry is dropped; a 0x40A00000 shape is not passed to EA. 0 = log only. Default 0
RealmGuard=0

[UafCheck]
; docs/539 §17 (uafcheck.cpp, counters v183 uaf*), TEST ONLY: delayed-free quarantine on EA's main heap (Free 0x4E5920, heap
; [0x11CB864]). Enabled=1: freed blocks of MinSize-MaxSize user bytes are filled with 0xFEEEFEEE and held in a FIFO ring (up to
; MaxBlocks / MaxMB, 64 MB in all with the ring) instead of freed; the oldest are checked and really freed. A changed dword logs
; "uaf: write after free" (block, size, offset, value, 0x40A00000 flagged, free stack, ms since free); all held blocks are
; checked at each save end, world quit and world load ("uaf: save end ..."). DrArms 1-4: after the first hit the next DrArms freed
; blocks of that size get a DR write watch on the hit offset for DrHoldSec ("watchpoint DRn hit" names the writer; takes a
; [CasTrim] WriteTrap slot when none is free). Costs memory and delays frees; a reader of freed memory now reads 0xFEEEFEEE. 0 = off
Enabled=0
MinSize=64
MaxSize=4096
MaxMB=48
MaxBlocks=262144
DrArms=2
DrHoldSec=600
; docs/539 §18 (0.36.230): Object blocks (ObjectService free through 0x4E3EF0 from Object_DeletingDtor, return 0x935E1B) are
; held like any block, tagged "Object block id ..." in the uaf lines. ObjectMaxSize > MaxSize lets larger Object blocks in too.
; 0 = MaxSize. A jmp at 0x4E5920 into another module is refused ("SKIP uaf check: ... already patched by another module")
ObjectMaxSize=0
; docs/539 §21 (0.36.234): TravelHold=1 keeps everything freed (MinSize-MaxSize; 8-65536 allowed) from a travel save start to the
; next world load end, up to TravelMaxMB (0 = MaxMB; clamped with the ring to 64 MB), so a stale write into a block freed during
; the travel is caught; "uaf: travel hold start / end" lines. 0 = off
TravelHold=0
TravelMaxMB=0

[SlotGuard]
; docs/539 §18 (slotguard.cpp), CRASH-TRIAGE: float-5 site 0x951A00 (SlotComponent clear 0x9519C0 read a 0x40A00000 slot array).
; Enabled=1: the five slot array pointers (+0x0C..+0x2C) of every SlotComponent are checked before each clear (teardown) and
; after each load (0x951F20) and clone (0x951AE0); a 0x40A00000 / non-heap / unreadable one logs "slot guard: float5 slot bad"
; with the owning Object, when, the last good check and a stack scan. Guard=1 also zeroes that pair so the teardown cannot fault
; (the old array leaks). 0 = off
Enabled=0
Guard=0

[Float5Free]
; docs/539 §19 (float5free.cpp), CRASH-TRIAGE: float-5 pointer passed to EA Free (crash 0x4E51BF eax=0x40A00000 from the SACS Walker
; mRequestQueue deque dtor 0x727E10 on world unload). Enabled=1: every EA Free 0x4E5920 call (one detour shared with [UafCheck]; works
; with UafCheck off) checks the pointer: 0x40A00000..0x40A0FFFF, not a heap pointer, unreadable chunk header or a chunk not in use logs
; "float5 free:" with caller, SACS Walker (caller 0x727E5C), free tag and a stack scan; the deque dtor 0x727E10 checks its pointer array
; and subarray pointers first ("float5 deque:"). Guard=1 skips that free / that deque destruction (the memory leaks, the game keeps
; running). 0 = off
Enabled=0
Guard=0

[Float5Sticky]
; docs/539 §21 (f5watch.cpp), CRASH-TRIAGE: the float-5 writer stores 0x40A00000 at one fixed address for a whole session
; (float5-round4/5). Enabled=1: the first 0x40A00000 address any detector reports ([UafCheck] write after free, [CasTrim]
; cells / records / strings / modelbuilder / realm, [SlotGuard], [Float5Free] deque, [Float5Watch] sweep, PortalCheck) gets a DR
; write watch on every thread for the rest of the session ("float5 sticky: write to ..." with value, eip, thread, stack; all
; 0x40A00000 writes, other values rate-limited), read at each save start and world load end ("float5 sticky: check at").
; PortalCheck=1: Portal_Save 0x64E9A0 (called at 0x62AF81 by the portal save list) gets its vector [+0x5C, +0x60) checked first
; ("float5 portal:"); PortalGuard=1 then skips a bad portal (al = 0: that lot save fails instead of the AV at 0x64ED7B). 0 = off
Enabled=0
PortalCheck=0
PortalGuard=0

[Float5Watch]
; docs/539 §21 (f5watch.cpp), CRASH-TRIAGE. Enabled=1: last-OK table of every float-5 check (outfits, SlotComponents, realm
; nodes) and "float5 window:" lines on each hit (last clean read, events since, sim / main thread now, our events ring); a worker
; sweeps registered outfits and SlotComponents every SweepMs (0 = no sweep) within BudgetUs per sweep. DrWatch=1: for DrWindowSec
; after a travel save start / world quit / world load end, every RotateSec the DrSlots newest SlotComponent +0x14 / outfit cell
; slots get a DR write watch ("float5 watch: WRITER DRk" / "write DRk"). 0 = off
Enabled=0
SweepMs=250
BudgetUs=4000
DrWatch=0
DrSlots=4
DrWindowSec=30
RotateSec=5

[MonoSigGuard]
; docs/539 §20 (monosig.cpp, counters v184 msg*): EA bug fix, ON in release (rare-crash rule: crashed twice, cause verified in the
; disassembly). 0xD70F90 (ScriptHost_InvokeDelegate 0xD75FA0) read params[0] of the delegate's Invoke signature before checking
; param_count == 1; for the zero-parameter SwapLoadScreen delegate (loading screens older than 2 s) that reads past the signature
; and crashed at 0xF4AC64 on travel. Enabled=1 checks param_count first and gives EA's own "not one Object[]" answer (same result
; as vanilla, minus the bad read). Log=1: "mono sig guard:" lines (first 20 a session, then every 1000th). 0 = off
Enabled=1
Log=1

[S3SSCompat]
; docs/539 §22 (s3sscompat.cpp): S3SS 1.6.3 LotStreamingOptimizations (streamingSettings) keeps re-writing 5.0f to the
; "Camera speed threshold" address it captured at the first world load (WorldManager+0xEC). After a travel that WorldManager
; is freed, so every later world load writes 5.0f into freed / reused EA heap (the float-5 crashes). ON in release (rare-crash
; rule: seen, repro, writer caught by a hardware watchpoint). StaleWriteGuard=1 sends that write to the live WorldManager
; (S3SS's own intent; Steam 1.67) or drops it (EA 1.69); other targets untouched. Acts only on the known-buggy S3SS build
; (file sha256 + code bytes); any other S3SS version logs "stands aside" and changes nothing. Log=1: "s3ss compat:" lines
; (first 20 corrections a session, then every 100th). 0 = off
StaleWriteGuard=1
Log=1

[PkgLock]
; docs/539 §13.9 (pkglock.cpp, counters v177 pk*): EA's package database lock-order deadlock (main-menu hang, ~4 in ~2100
; harness loads). Readers take the database lock O+0x48 then the file lock O+0xC0; the main thread's idle close takes them
; the other way round. Mode: 0 = off (EA order), 1 = the idle close tries the database lock first and skips to a later
; update when a reader holds it (never blocks the main thread), 2 = EXPERIMENTAL: 1 + the database lock taken before every
; begin access from a thread that does not own it. Default 0 until the pkg-abba repro proves Mode 1.
Mode=0
; 1 = "[PkgLock] ABBA:" line when a thread holds the file lock 3 s while another holds the database lock (read-only, any Mode)
; plus a "pkglock:" counter line per minute when they moved
Detect=0
; TEST ONLY, never in release inis: no idle interval, and the idle close waits up to this many ms for a reader to own the
; database lock (Mode 0: holding the file lock; Mode 1: before its try, so it defers), readers of that package hold the
; database lock as long; first 300 such closes (repro pkg-abba at the main menu, "pkglock: ReproWiden defer:" line)
ReproWiden=0

[LotPool]
; docs/541 (lptrim.cpp, counters v913 lp*; one game run, al323): EA's lot message pool (0x11EB590, 272-byte slots)
; grows to its world-load peak and never gives a core back before exit (al320 Bridgeport: 599 cores, 20.2 MiB, 99%+
; of the slots free, 494-553 cores with every slot free). Trim=1: SettleSec after each world load, under the pool's own
; lock, the cores whose every slot is free (all but KeepCores) leave the pool and go back to the EA heap. Anything that
; does not read as expected skips the trim and changes nothing. Needs [UserDiag] (world loads come from its line).
Trim=0
; seconds after a world load (5-3600)
SettleSec=60
; completely free cores left in the pool (0-4096), so the next burst does not add cores at once
KeepCores=16

[BigBlock]
; docs/543 (bigblock.cpp), NOT RUN IN GAME: built and host-selftested only. What: EA's direct big blocks (the 128 KB+
; requests 0x4E50F0 gives their own VirtualAlloc) go to the top of the address space, Mono sub-heap cores stay at the
; bottom, and freed blocks keep their reservation for the next block of the same size. Why: each travel round trip leaves
; such blocks scattered through the middle of the space (one trip: largest free block 1630 -> 1406 MB), and Error 12 comes
; when no large free block is left. Risk: changes where every big EA block lands; Reuse keeps up to ReuseMaxMB of address
; space reserved with no RAM behind it. Stands down when Apex Radiance is loaded and [Compat] ApexStandDown=1 (its
; FastMemory uses the same byte and the same VirtualFree call). A "bigblock:" line at every "diag: mem" mark ([MemDiag]).
; Master switch: 0 = nothing installed (default), 1 = the switches below
Enabled=0
; 1 = MemoryMan heap byte +0x498 set once the heap exists, so EA's own code passes MEM_TOP_DOWN for direct blocks
; (checked first: page size 4 KB, core reserve / commit 16 / 4 MB or 4 / 1 MB, else skipped)
TopDown=0
; 1 (needs TopDown=1) = the Mono sub-heap core supplier's blocks (1 MB and up) without MEM_TOP_DOWN, so the Mono heap
; stays at the bottom while the other big blocks fill from the top
MonoBottom=0
; 1 = a freed direct block of 64 KB to ReuseMaxBlockMB is decommitted (RAM back) but stays reserved, and the next block of
; the same 64 KB size class reuses it (fresh zero pages); the oldest are released past ReuseMaxMB
Reuse=0
; address space kept reserved for reuse, MB (1-1024)
ReuseMaxMB=128
; largest block kept, MB (1-256, at most ReuseMaxMB)
ReuseMaxBlockMB=16

[Compaction]
; docs/204 (0.36.128, ts3fixes Compaction.cs, counters ts3fixes 427-438), NOT RUN IN GAME (queue compaction-verify.json):
; quiet save-reload. After a normal save (Save, Save As, an async autosave) that ended with result 0 (saved) while the largest
; free address-space block is under ThresholdMB, ts3fixes unloads the world and loads the same save again in the same
; process behind EA's loading screen ("Compacting... (your game is saved)"), then puts back game speed, the open HUD
; panel, the selected Sim, the camera and the queues of the Sims the player can see. Never on travel, vacation,
; university, Edit Town, Build/Buy/CAS, during an emergency or after a failed save; any failure goes back to normal play
; and turns Compaction off for the session. Nothing goes into the save (state lives in ts3fixes' memory).
; 0 = off (default), 1 = opt-in: compact after such a save, 2 = offered: ask "Compact now?" each time (Compact / Not now).
; Needs [UserDiag] Enabled=1 and [SaveWrite] Enabled=1. Lines "compaction: ..." (verdict, begin, done, +N min).
Enabled=0
; Largest free block (MB) under which a save compacts. With Apex Radiance's MemoryGuard on it is at least 320 (its own
; low line), so Apex's cache trim always gets the first try. Placeholder until the save-reload-memory.json data (§3.2).
ThresholdMB=320
; Hysteresis: after a compaction the block must be back above ThresholdMB + RearmMB before the next one; a compaction
; that does not reach it turns Compaction off for the session ("restart the game" notice once).
RearmMB=256
; At least this many minutes since the last compaction or world load (real time).
MinMinutes=60
; 0 = direct (EA's in-game Load: ReloadWorld, no menu), 1 = main menu (Quit to Main Menu, then load; also clears EA's
; return-to-menu statics; the menu may show for a frame).
Route=0
; One "compaction: +N min" memory line at the first periodic sample this many minutes after the reload.
AfterMinutes=10

[SaveCompress]
; Package commit compression on worker threads (docs/15 phase 10): at the commit call 0x4A850F the committing thread copies the
; pending records' bytes ahead of the commit loop and workers run the game's own RefPack compressor 0x4EC0A0 on them (own
; scratch memory, no game allocator, no Mono). The codec slot 0xFB901C answers a call with the same input, length and mode
; from the finished job; anything else runs the game's code. Offline: every record of three Baseline saves byte-identical
; to the serial path, 3.3-3.6x faster commit (out\savecompress-test.exe). Skips itself when the compressor code differs from
; Steam 1.67. OFF: in game 2026-10-14 no batch ran (save records commit one by one on close, docs/15 phase 10);
; with Enabled=1 it still logs per save how many compress calls ran outside a batch and their time.
Enabled=0
; Start value of the runtime switch (ts3native_counters.compressMode): 0 = the game compresses in the commit loop, 1 = workers.
Mode=1
; 1 = every answered call also runs the game's compressor and uses its result (counts mismatches). Slow: first runs only.
Verify=0
; Worker threads. Range 1-8.
Threads=6
; Record copies plus outputs in flight (address space at save time). Range 4-256.
MaxMB=32
; Compressed-bytes cache (docs/26 §8): a save record whose uncompressed bytes equal an earlier one's (same length, mode,
; 64-bit hash) gets the stored compressed bytes instead of a new compression: the game's own output, byte for byte. Hits
; only on the 2nd+ save of a load (about 40% of the bytes after play, ~100% with no play between). MB of compressed bytes
; kept (address space, all the time once filled); 0 = off. Verify=1 above also compresses every hit and compares. Range 0-256.
CacheMB=0

[FootprintIndex]
; Save: the routing footprint writer 0x6663C0 scans the whole world footprint map once per floor level of every lot
; (docs/25, ~1.2 s per Bridgeport save). With this on it walks the map once per lot and hands the writer only that level's
; entries, in the same order, so the save bytes are the same. One log line per save: "footprint: levels N entries M
; matched K calls C ms T verify ...". Skips itself when the code differs from Steam 1.67. OFF until verified in game.
Enabled=0
; Start value of the runtime switch (exported DWORD ts3native_footprintMode): 0 = the game's scan, 1 = the index.
Mode=1
; 1 = also walk the real map for every level and compare; a mismatch uses the real map (counted in the log line). Slow.
Verify=0

[HeightCache]
; Terrain height cache (docs/20 §4b): route search asks 0xC2A570 for the same points again and again; cached per
; (grid, x, z), dropped on every cell rebuild 0xC2A840. Runtime switch ts3native_counters.heightMode (+0x1B4), counters v13
; (docs/registry.md). OFF until verified in game.
Enabled=0
Mode=1
; Verify=1: every hit also runs the raycast and compares the bits (first 10 mismatches logged).
Verify=0
; 2-way sets, 40 B per entry (65536 = 2.5 MB); per-cell invalidation (docs/20 §4b).
Entries=65536

[TerrainGrave]
; H6 S3a (docs/60 §2.2 #2, docs/38 C1, 0.10.11): the terrain cell rebuild 0xC2A840 frees the cell's old collision shape
; while other threads may still ray-cast through it (0xC2A570). With this on, that one release (PhysShape_Release 0x682760
; called from 0xC2A896) is parked in a 64-entry ring and run at the next rebuild once no ray is in flight. Uses the
; [HeightCache] detours (installed without a table when [HeightCache] is off). Counters v25 tg* / vfRtGrave*, and
; vfSwaps / vfSwapsInRay from these stubs. OFF until verified in game.
Enabled=0
; Start value of the runtime switch tgMode (+0xD00; --ab terraingrave): 0 = the game's release, 1 = park.
Mode=1

[GcThreadCheck]
; Measurement only (docs/29 §4.5): logs the first thread that reaches a GC slow path and counts slow-path allocations
; from any other thread (counters v14 gcForeignAllocs; first 8 logged with the caller's return address). > 0 means a
; thread allocates through the unlocked GC_malloc fast path = latent heap race. No behaviour change.
Enabled=0

[GcRootCheck]
; Measurement only (docs/67 §22.4, 0.36.96, OFF): at every stopped mark (GC_notify_event 1) walks EA's task container
; (host+0xB84) and checks each task state's frame-arena chain (top inside its chunk, no chunk or state on a GC free
; list) and the running task's frames (arena base below its chunk's top = scanned). First 16 mismatches logged with the
; state's method; minute line "gc root check:". Reads only; cost ~one container walk per collection.
; 0.36.97 (docs/67 §22.5): also, when the mark is complete (event 3, before reclaim), every word of every rooted chunk's
; scanned range must point at a marked or free-listed object, every chunk must be marked and end in EA's descriptor;
; misses logged as "gc frame audit:" (first 16), minute line "gc frame audit:". Cost ~1-3 ms per collection [inferred].
; 0.36.98 (docs/67 §22.6): unmarked words split by block stamp (window = allocated after the mark, EA keeps the block);
; at every stopped mark each container, current and pooled chunk must end in EA's descriptor ("gc desc watch:", first 8,
; names the saved frame that ends at the chunk end). RestoreDesc=1 writes a lost descriptor back (Crash S fix check).
Enabled=0
RestoreDesc=0
; TailWatch=1 (docs/67 §22.7, 0.36.100, needs Enabled=1; logging only): names the writer. Method entries (0xE563B2) whose
; frame leaves < 16 bytes before its chunk end arm DR0-DR3 on [end, end+16) for the sim thread; a write there logs
; "arena tail watch: hit" (eip, value, the frame's method and area sizes, script stack). SKIP with [Watchpoint] on.
TailWatch=0

[ArenaGuard]
; docs/67 §22.2 (0.36.95, OFF until its run): EA's interpreter frame-arena pool can hold a chunk twice (a task that ends
; by a managed exception is released twice, docs/120 §9.1); a second state then gets a chunk a yielded task still uses and
; overwrites its locals, so the GC frees what only those slots held (Crash S shape). 1 = clear the state's chain after
; release-all and drop pooled chunks that are in use before each grow ([MonoThread] ArenaFix without the worker; skipped
; when [MonoThread] GcLock=1 owns the sites). Minute line "arena guard:"; counts in ts3native_mtprobe.
Enabled=0
; TailPad (docs/67 §22.7, 0.36.100, OFF until its run; independent of Enabled): Crash S fix. Every interpreter frame-arena
; chunk ends in EA's GC descriptor right after the last frame byte, and a frame that overruns its declared size there
; zeroes it, so the collector skips that chunk's frames and frees what they hold. 1 = six byte patches in EA's arena code
; keep 64 bytes between the frame area and the descriptor (pool chunk end 0x7FC -> 0x7BC, own chunks sized +64). Applied at
; load, all or none. Minute line "arena tail:".
TailPad=1
; InitobjFix (docs/67 §22.9, 0.36.102, OFF until its run; independent of Enabled): the Crash S writer. EA's interpreter
; zeroes 12 bytes for `initobj` on an Int64/UInt64/Double slot of 8 (e.g. List<ulong>.RemoveAt's default(T)), 4 past the
; slot: at a chunk's last frame that is the GC descriptor. 1 = the transform's size call (0xE63427) takes the smaller of
; EA's size and the storage size. Log line "initobj size:".
InitobjFix=1

[IcLockCheck]
; Measurement only (docs/29 §5): replaces mono_loader_lock/unlock 0xE85020/0xE85030 (global loader_mutex 0x11F43A8) with
; counting versions of the same lock: enters, contended enters (TryEnter failed) with QPC wait, owner thread changes,
; unlocks with waiting threads (counters v15). Logs [0x11EE6CC] and the first 32 distinct caller addresses. No behaviour change.
Enabled=0

[RouteGate]
; Measurement only (docs/18 H6 step S2a): tracks which thread owns the routing lock world+0x918 (Lock_Acquire 0x4E16F0 and
; Lock_Release 0x4E17B0, that lock only; learned from Route_PlanLocked) and puts pass-through stubs on the 12 S0 gate sites
; plus gate sites 13-15 (docs/60 §2.2: 0x628A90, 0x835240, 0x835110; 0.10.11).
; Counts per site the outermost entries by a thread that does not hold +0x918 (rgUnlocked) and those made while a
; route-worker or async job runs (rgJob: 0 unless [RouteWorker] Mode=1 or async is on), counters v16 + v25. Also the exact
; G11 window (g11*: sim-thread plan length vs the gap to the next routing touch, docs/18 (3)). Logs the first 48 distinct
; site/caller pairs. No locking, no behaviour change. Installs nothing if one prologue differs.
; 0.36.0: ON by default (Enabled, Sites, Enforce = 1): background routing ([RouteAsync]) needs all three.
Enabled=1
; H6 S2b (docs/60 §2.3, 0.10.11): count-only stubs on the docs/60 §2.2 closure sites (quadtree readers, writers and leaves,
; object destroy, lot index and pending updates, save / BuildRoutingData / lot save, routing debug frame, world init and
; teardown), counters v25 vfRt*. Needs Enabled=1. Each site installs on its own. Run with [RouteWorker] Mode 0 and 1.
Sites=1
; H6 S3b + M1 (docs/60 2.2-2.5, 0.11.0, counters v26): 1 = closures on while an async job runs: gate entries by other
; threads wait for the job (the sim thread runs the job's managed calls meanwhile), the owner borrows the job's lock inside
; a callback, quadtree lock for the worker's readers vs mutators, destroys and saves wait for the job, routing debug frame
; skipped, travel / quit ICs 0xEC1180 / 0xEC11B0 drain and refuse START until the next world init. START only in a quiet
; world (no save, no pending lot updates, clean lot index; asyncRefusedM1). Needs Enabled=1, Sites=1 and [RouteAsync].
Enforce=1
; Design G10-C (docs/87 §5, 0.20.0, counters v38 p10Ready bit 1): 1 = gate site 10 moves from the goal step 0x75C2D0 to its
; only caller Route_PlanCommon 0x7606E0 (prologue checked; differs: logged, site 10 stays). With Enforce=1 a sync plan then
; waits once for a running job and keeps job starts off for the whole plan (goal step, Route_PlanLocked, EditPath tails);
; holds >= 100 ms are logged ("G10-C:", first 20). Gate-10 counters and the wait key (Route_PlanCommon's caller 0x76429D /
; 0x764400 instead of 0x760BFF) then describe the whole plan. Load-time only (no runtime switch). OFF: not run in game.
G10Common=0
; HoldKeyed (0.36.58, counters v124, docs/189 phase 1): 1 = inside a P5c window ([RouteSnap] FreeLock=1: the worker has the
; job's +0x918 lent out for a clone run) the sim's gate waits of sites 0, 3, 4 and 6-9 (lot table insert, lazy lot build,
; lot rebuild, Q resets) take the lent lock instead of waiting for the whole job; a recorded write they make
; refuses the answer (P5cStale). Sites 1, 2, 5, 10-15 wait as before. Latched per job; runtime switch holdkeyed.
; 2 (0.36.63, docs/189 §10): and sites 1, 2, 10, 11, 15 (goal-step lot planner, lazy room connectivity, the coarse goal step,
; GetConnectedRooms, FindPlacesOnShoreline): their room-record fill is never read by a clone run. Gate 10 then holds +0x918
; through the sim's sync plan; a retake that waits RetakeEscalateMs on such a frame turns HoldKeyed (not lending) off (hgLongHold).
HoldKeyed=0

[Discourage]
; Design D (docs/84 §2.4, 0.12.0, counters v30): while an async route job runs, RoutingWorld_Add/RemoveDiscourageFootprint
; (0x834370 / 0x834860) are recorded and applied in order later on the sim thread with no job running (script ignores their
; result). Needs [RouteGate] Enforce=1. Runtime switch discMode (+0x1074, --ab discourage). 0.12.2 crashed applying a
; deferred Add (AV under the lot lookup 0xC62D40 called from 0x834519; 2026-10-17); fixed by D-X below (0.16.0).
; 0.36.0: ON by default with [RouteAsync] (every env-on run since 0.12.4 had it on).
Enabled=1
Mode=1
; Fix D-X (docs/84 §7.2, 0.16.0, counters v34), correctness parts of D, on whenever Enabled=1 (set 0 only for an A/B):
; DestroyApply=1: a destroy (ObjectService_DestroyById) first applies its object's queued Remove records and drops its Add
; records (runtime switch discDestroyMode +0x135C, --ab discdestroy). DeadSweep=1: a Remove record whose object is gone at
; apply removes the footprints left under its id (0x635700, all lots; discSweepMode +0x1360, --ab discsweep). Tripwire
; T-D5: discDropRemove = discDeadSweep; discIdMismatch must stay 0.
DestroyApply=1
DeadSweep=1
; Design U (docs/89 §5.1, §10, counters v74): while a job runs, RoutingWorld_UpdateSimFootprint 0x833560 (remove plus
; re-insert of one object's routing footprints; sim waits under key 0x833593) is queued into the queue above after its
; lock-free early out, and applied in order with D's records (drain points, destroy gate, dead-id sweep). Needs Enabled=1.
; Runtime switch usfMode (+0x3178, --ab deferfootprint). Tripwires: usfApplyInJob = 0, usfAgeMaxMs < 300, usfSwept =
; usfGoneEnable0. 0 = off (default until measured in game).
DeferFootprint=1
; Design U phase 2 (docs/89 §12, counters v94): the same deferral for RoutingWorld_ObjectFootprintFromTool 0x8334A0 (key
; 0x8334CC, event 0x0E transform published; the callers' world +0x978 byte is replayed at the apply) and
; RoutingWorld_UpdateObjectLot 0x82D280 (key 0x82D296, events 9 / 0x0A). The private-footprint ICs (call sites 0x75465E,
; 0x75DE1A) flush the object's queued records first. Needs DeferFootprint=1. Runtime switch fp2Mode (+0x3FB4, --ab
; deferfootprint2). Tripwires: fp2ApplyInJob = 0, fp2FullPass = 0, fp2AgeMaxMs < 300. 0 = off (not run in game).
; 2 = installed with fp2Mode 0 (order rule only; for DeferPrivateFp alone).
DeferFootprint2=1
; LostRemovalFix (docs/89 §16, counters v172 fp2lr*): a queued UpdateObjectLot record keeps the lot of the call and always reaches the
; lot map through 0x82C120, object alive or gone; 0x833680 (event 9, the re-insert) applies the object's records first. Fixes the ghost
; footprint a destroy during a route job left behind (plan result 16 forever, household Sims too). 0 = the old rules. Runtime switch
; fp2lrMode (+0x5DE8, --ab lostremoval). Needs DeferFootprint2. Tripwires: fp2ApplyInJob = 0, fp2lrOrderMiss = 0.
; diag: mem lines carry fpLost (removals lost, fix off), fpLoad (ghosts the census counted at load), fpSaved (removals the fix kept).
LostRemovalFix=1
; RemovalFirst (docs/89 §18): a START of a route not known unseen, with a removal still queued behind a running job, parks until the removal
; is applied (READY ticks, no sim-thread wait, ~250 ms, then the existing forced drain). Fixes the one-off result 16 after a region's Cleanup
; (the Sim walks off from the stove). 0 = off. Log line "footprint removal first": parked, capped (expected 0), max ticks.
RemovalFirst=1
; GhostSweep (docs/89 §17, counters v172 gh*): one pass over the footprint map inside the load screen, for ghosts older saves carry.
; 0 = off, 1 = count only (per-id log lines, a per-class line, the time; the code default when this key is missing), 2 = remove (v0.2.10 ships 2).
; Only entries with the full signature count, never a live object and no non-object id; a failed read keeps it. The census line gives the removed count.
GhostSweep=2
; DeferPrivateFp (docs/89 §14, 0.36.42, counters v113 pf*): the IC RouteManager_RemovePrivateFootprint's call 0x75465E ->
; RemoveFootprintLocked 0x82A0C0 (key 0x82A0F6; DynamicSimFootprint off at OnAboutToStartFollowingRoute) on the sim thread
; while a job runs becomes a record in the same FIFO, answered 1 (script pops it), applied in order at the drain points.
; Needs DeferFootprint2=1 or 2. Runtime switch pfMode (+0x4740, --ab deferprivatefp). Tripwires: pfApplyInJob = 0,
; pfFullPass = 0. 0 = off (not run in game).
DeferPrivateFp=0
; PlanDrain (docs/89 §13, 0.36.36, counters v107 sd*): before every sim-thread sync plan (Route_PlanLocked detour, after its
; early outs) the deferred footprint records above are applied (DiscDrain), so the plan sees the world DeferFootprint=0 would
; give it. Skipped inside a job callback, with +0x918 owned, with the P5c lent lock, or with an Add record queued (sdSkip).
; Needs DeferFootprint=1. Runtime switch sdMode (+0x458C, --ab plandrain). Default 0 until the ip-boat-exit-defer-loop verify.
PlanDrain=0
; Design G standalone (docs/88 §10, counters v76 dp*): a destroy (ObjectService_DestroyById) on the sim thread while any
; async route job runs parks one reference and runs without waiting for the job (key 0x2000003); parked references are
; released at the next point with no job (next destroy, Route.Plan START/READY polls, save, travel/quit). Same graveyard as
; [RouteSnap] FreeLock (P5c) but needs neither it nor this section's Enabled; needs [RouteGate] Enforce=1. Kept wait: D-X
; records queued for the id, graveyard full (512), closing, job callback, off the sim. Runtime switch dpMode (--ab
; destroypark). Tripwire T-G1: p5cCountLow must stay 0. OFF: not run in game.
DestroyPark=1
; DestroyParkDx=1 (counters v904 dx*, runtime switch dxMode +0x5BCC, --ab destroyparkdx): a destroy whose id has queued
; discourage records (D-X) parks too, instead of waiting for the job to apply them first; the records stay queued and the
; next drain treats the id as gone (Remove / disable swept by id, Add / enable / phase-2 dropped). Needs DestroyPark=1 and DeadSweep=1 (no sweep: keeps the wait). OFF.
DestroyParkDx=1

