; Adaptive diag kit (docs/316): merged into the diagnostic builds ts3native.ini at install (kit option 3, D). Never in the
; release ini. Level 0 = these detectors at their cheap settings; the rules engine raises them at run time or for the next
; session (ts3native.adaptdiag-state.ini, docs/317).
[AdaptDiag]
Enabled=1
MaxActive=3
TtlMin=15
BudgetUsPerS=5000
LineCapKB=4096
LogCapMB=200
SwapInvokeDiag=0

[UserDiag]
Enabled=1

[HitchAttr]
HitchMs=1000

[StallWatch]
Enabled=1

[PcCheck]
Enabled=1

[CrashReport]
Enabled=1

[Diag]
ModTime=1
ModTimeHz=10
